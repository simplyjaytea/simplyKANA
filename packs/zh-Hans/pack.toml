# Chinese (simplified) pack. Built by: python3 -I tools/build_pack.py zh-Hans
language = "zh-Hans"
name = "Chinese"
widget_name = "simplyKANA · Chinese"
widget_slot = 1
level_labels = { hsk = "HSK {n}" }
level_summary = "HSK 1–3"
voice = "zh-CN"
speak_reading = false
script_parts_of_speech = []
placeholder = { orthography = "水", reading = "shuǐ", meaning = "water", part_of_speech = "noun", level = { hsk = 1 } }

# Dana, design-direction §2: word and reading faces, bundled serif → iOS serif → iOS sans.
[fonts]
orthography = ["NotoSerifSC-Medium", "STSongti-SC-Bold", "PingFangSC-Medium"]
reading = ["NotoSerif-Regular", "Georgia"]

[join]
kind = "cedict-wordlist"
script = "tools/build_zh.py"
inputs = ["complete.json", "cedict_ts.u8"]

[[source]]
title = "CC-CEDICT"
detail = "Pinyin and meanings. MDBG."
licence = "CC-BY-SA 4.0"
url = "https://www.mdbg.net/chinese/dictionary?page=cc-cedict"
fetch = "https://www.mdbg.net/chinese/export/cedict/cedict_1_0_ts_utf-8_mdbg.zip"

[[source]]
title = "HSK 3.0 word list"
detail = "complete-hsk-vocabulary (drkameleon), from elkmovie/hsk30; levels only."
licence = "MIT"
url = "https://github.com/drkameleon/complete-hsk-vocabulary"
fetch = "https://raw.githubusercontent.com/drkameleon/complete-hsk-vocabulary/main/complete.json"
