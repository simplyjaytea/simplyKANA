name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a PR cancels its older run. Runs on main are never
# cancelled or dropped: each main commit gets its own group, so every
# merged commit gets checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core-linux:
    name: KanaCore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: kana-core
        run: swift test
