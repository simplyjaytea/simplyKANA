name: CI (macOS)

# macOS minutes count ~10x against the free allowance. Playbook rule 3:
# run on any change to kana-core/**, bundled data or workflows; skip docs only.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']

concurrency:
  group: ci-macos-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core-macos:
    name: KanaCore (macOS / Xcode)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | tail -1)"
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Test
        working-directory: kana-core
        run: swift test
      - name: Build for iOS Simulator
        working-directory: kana-core
        run: |
          xcodebuild -scheme KanaCore \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            build

  app:
    name: App + widget (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | tail -1)"
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build and test on the iOS Simulator
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          echo "Simulator: $UDID"
          mkdir -p "$RUNNER_TEMP/snapshots"
          TEST_RUNNER_SNAPSHOT_DIR="$RUNNER_TEMP/snapshots" xcodebuild test \
            -project SimplyKANA.xcodeproj -scheme SimplyKANA \
            -destination "id=$UDID" CODE_SIGNING_ALLOWED=NO 2>&1 | tail -150
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: warn

  ipa:
    name: Unsigned IPA (device build)
    runs-on: macos-15
    permissions:
      contents: write   # to publish the rolling "alpha" prerelease on main
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | tail -1)"
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build for iPhone, unsigned
        run: |
          set -o pipefail
          xcodebuild build -project SimplyKANA.xcodeproj -scheme SimplyKANA \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tail -40
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SimplyKANA.app Payload/
          zip -qry SimplyKANA.ipa Payload
      - name: Check IPA
        run: |
          MIN=$(grep -oE 'iOS: "[0-9.]+"' project.yml | grep -oE '[0-9.]+')
          tools/check_ipa.sh SimplyKANA.ipa "$MIN"
      - uses: actions/upload-artifact@v4
        with:
          name: SimplyKANA-ipa
          path: SimplyKANA.ipa
      # One stable link: a single rolling prerelease, replaced on every green main.
      # Only reached if the checks above passed.
      - name: Publish "alpha" prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          gh release delete alpha --yes --cleanup-tag 2>/dev/null || true
          gh release create alpha SimplyKANA.ipa --prerelease --target "$GITHUB_SHA" \
            --title "Alpha $(date -u +%Y-%m-%d) ($SHORT)" \
            --notes "Unsigned alpha build of main at $SHORT. Install with Sideloadly or AltStore: see the README section 'Install the IPA without a Mac'. Expires 7 days after install with a free Apple ID."
