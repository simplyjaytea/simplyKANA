# Generated into SimplyKANA.xcodeproj by XcodeGen (`xcodegen generate`).
# The .xcodeproj is not committed; this file is the source of truth.
name: SimplyKANA
options:
  bundleIdPrefix: com.simplyjaytea
  deploymentTarget:
    iOS: "16.0"   # Lock Screen widgets start at iOS 16; nothing lower is possible
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Change this one line if Xcode says the bundle ID is taken. Everything else
    # (widget ID, App Group) is derived from it. CI passes CODE_SIGNING_ALLOWED=NO.
    BUNDLE_ID_BASE: com.simplyjaytea.simplyKANA
    APP_GROUP: group.$(BUNDLE_ID_BASE)
packages:
  KanaCore:
    path: kana-core
targets:
  SimplyKANA:
    type: application
    platform: iOS
    sources: [App, Shared]       # Dana: everything under App/ is picked up
    dependencies:
      - package: KanaCore
      - target: SimplyKANAWidget
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: simplyKANA
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLSchemes: [simplykana]
        AppGroup: $(APP_GROUP)
    entitlements:
      path: Generated/App.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE)
  SimplyKANAWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    dependencies:
      - package: KanaCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Generated/Widget-Info.plist
      properties:
        CFBundleDisplayName: simplyKANA
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        AppGroup: $(APP_GROUP)
    entitlements:
      path: Generated/Widget.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE).widget
  SimplyKANATests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: SimplyKANA
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  SimplyKANA:
    build:
      targets:
        SimplyKANA: all
        SimplyKANATests: [test]
    test:
      targets: [SimplyKANATests]
