# Generated into SimplyKANA.xcodeproj by XcodeGen (`xcodegen generate`).
# The .xcodeproj is not committed; this file is the source of truth.
name: SimplyKANA
options:
  bundleIdPrefix: com.simplyjaytea
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"   # simulator only until there is an Apple account
packages:
  KanaCore:
    path: kana-core
targets:
  SimplyKANA:
    type: application
    platform: iOS
    sources: [App, Shared]       # Dana: everything under App/ is picked up
    dependencies:
      - package: KanaCore
      - target: SimplyKANAWidget
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: simplyKANA
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLSchemes: [simplykana]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplyjaytea.simplyKANA
  SimplyKANAWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    dependencies:
      - package: KanaCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Generated/Widget-Info.plist
      properties:
        CFBundleDisplayName: simplyKANA
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplyjaytea.simplyKANA.widget
  SimplyKANATests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: SimplyKANA
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  SimplyKANA:
    build:
      targets:
        SimplyKANA: all
        SimplyKANATests: [test]
    test:
      targets: [SimplyKANATests]
